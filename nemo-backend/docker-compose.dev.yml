# Development compose with hosted LLM API
# Use: docker compose -f docker-compose.dev.yml up -d

networks:
  metaglass-net:
    driver: bridge

volumes:
  pgdata:

services:
  postgres-postgis:
    image: imresamu/postgis:15-3.4-alpine
    container_name: metaglass-postgres
    networks: [metaglass-net]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/schema/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metaglass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metaglass2026}
      POSTGRES_DB: ${POSTGRES_DB:-metaglass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaglass"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nemoclaw:
    build: ./services/nemoclaw
    container_name: metaglass-nemoclaw
    networks: [metaglass-net]
    ports:
      - "8090:8090"
    depends_on:
      postgres-postgis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: postgres-postgis
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-metaglass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metaglass2026}
      POSTGRES_DB: ${POSTGRES_DB:-metaglass}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-nvidia/llama-3.1-nemotron-ultra-253b-v1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      NEMOCLAW_CONFIDENCE_THRESHOLD: 0.7
      SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN:-}
      MTA_API_KEY: ${MTA_API_KEY:-}
      # Ollama fallback (running on host when hosted API unavailable)
      USE_OLLAMA: "true"
      OLLAMA_HOST: host.docker.internal
      OLLAMA_PORT: 11434
      OLLAMA_MODEL: llama3.2:3b
    restart: unless-stopped
