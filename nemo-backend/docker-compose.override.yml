services:
  browser-test-client:
    build:
      context: ./browser-test-client-react
      dockerfile: Dockerfile
    container_name: metaglass-browser-test-client
    networks: [metaglass-net]
    ports:
      - "5174:5174"
    depends_on:
      middleware:
        condition: service_started
      nemoclaw:
        condition: service_started

  data-pipeline:
    build:
      context: ./data
      dockerfile: human-impact/Dockerfile
    container_name: metaglass-data-pipeline
    networks: [metaglass-net]
    depends_on:
      postgres-postgis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SOCRATA_APP_TOKEN: ""
      SOCRATA_RESTAURANT_ENDPOINT: "https://data.cityofnewyork.us/resource/43nn-pn8j.csv"
      SOCRATA_COLLISION_ENDPOINT: "https://data.cityofnewyork.us/resource/h9gi-nx95.json"
      SOCRATA_311_ENDPOINT: "https://data.cityofnewyork.us/resource/erm2-nwe9.json"
      PIPELINE_CRON_HOUR: "2"
      PIPELINE_CRON_MINUTE: "0"

  ollama:
    image: ollama/ollama:latest
    container_name: metaglass-ollama
    networks: [metaglass-net]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  nemotron-nim:
    image: busybox:latest
    container_name: metaglass-nemotron
    networks: [metaglass-net]
    command: ["sh", "-c", "echo healthy > /tmp/health && httpd -f -p 8000 -h /tmp & while true; do sleep 3600; done"]
    deploy:
      resources:
        reservations:
          devices: []
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  riva-asr:
    image: busybox:latest
    container_name: metaglass-riva-asr
    networks: [metaglass-net]
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    deploy:
      resources:
        reservations:
          devices: []
    healthcheck:
      test: ["CMD", "true"]
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 1s

  riva-tts:
    image: busybox:latest
    container_name: metaglass-riva-tts
    networks: [metaglass-net]
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    deploy:
      resources:
        reservations:
          devices: []
    healthcheck:
      test: ["CMD", "true"]
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 1s

  nemoclaw:
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NEMOTRON_NIM_HOST: host.docker.internal
      NEMOTRON_NIM_PORT: "8000"
      NEMOTRON_MODEL_NAME: nemotron-3-nano
      NEMOCLAW_CONFIDENCE_THRESHOLD: "0.7"
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      USE_OLLAMA: "true"
      OLLAMA_HOST: ollama
      OLLAMA_PORT: "11434"
    depends_on:
      ollama:
        condition: service_started

  middleware:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TAILSCALE_GN100_IP: "0.0.0.0"
      TAILSCALE_GN100_PORT: "8080"
      NEMOCLAW_HOST: nemoclaw
      NEMOCLAW_PORT: "8090"
      RIVA_ASR_HOST: host.docker.internal
      RIVA_ASR_PORT: "50051"
      RIVA_TTS_HOST: host.docker.internal
      RIVA_TTS_PORT: "50052"
      LOG_LEVEL: info
      NODE_ENV: production
      PROACTIVE_ALERTS_ENABLED: "false"

  postgres-postgis:
    image: imresamu/postgis:15-3.4-alpine

volumes:
  ollama-data:
