<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nemo Browser Test Client</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 980px; }
    h1 { margin: 0 0 16px; }
    .row { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    input, textarea, button { font-size: 14px; padding: 8px; }
    input, textarea { width: 100%; box-sizing: border-box; }
    textarea { min-height: 72px; }
    .inline { display: flex; gap: 10px; align-items: center; }
    .inline > * { flex: 1; }
    .small { font-size: 12px; color: #555; }
    #log { white-space: pre-wrap; background: #0f172a; color: #d1fae5; padding: 12px; border-radius: 8px; min-height: 220px; overflow: auto; }
    .ok { color: #065f46; }
    .bad { color: #991b1b; }
  </style>
</head>
<body>
  <h1>Nemo Browser Test Client</h1>
  <div class="small" style="margin-bottom: 8px;">
    Prefer chat-style testing? Open <a href="/chat-ui.html">/chat-ui.html</a>.
  </div>

  <div class="card">
    <div class="inline">
      <div>
        <label for="wsUrl">WebSocket URL</label>
        <input id="wsUrl" value="ws://localhost:8080/ws" />
      </div>
      <div>
        <label for="httpBase">HTTP Base</label>
        <input id="httpBase" value="http://localhost:8080" />
      </div>
    </div>
    <div class="row">
      <button id="connectBtn">Connect + Setup</button>
      <button id="disconnectBtn">Disconnect</button>
      <button id="healthBtn">Check /health</button>
      <button id="metricsBtn">Check /metrics</button>
      <button id="alertBtn">POST /admin/alert</button>
    </div>
    <div id="status" class="small">WS status: disconnected</div>
  </div>

  <div class="card">
    <label for="userText">User Text</label>
    <textarea id="userText">Any safety concerns around me right now?</textarea>
    <div class="row">
      <button id="sendTextBtn">Send Text Turn</button>
    </div>
  </div>

  <div class="card">
    <div class="inline">
      <div>
        <label for="lat">Latitude</label>
        <input id="lat" value="40.7580" />
      </div>
      <div>
        <label for="lon">Longitude</label>
        <input id="lon" value="-73.9855" />
      </div>
    </div>
    <div class="row">
      <button id="sendLocationBtn">Send location update</button>
      <button id="sendLocationPingBtn">Send locationPing</button>
    </div>
  </div>

  <div class="card">
    <div class="small">Useful docs: <a href="http://localhost:8090/docs" target="_blank" rel="noreferrer">NemoClaw Swagger</a> | <a href="http://localhost:8081/docs" target="_blank" rel="noreferrer">User Profile Swagger</a></div>
  </div>

  <div class="card">
    <strong>Event Log</strong>
    <div id="log"></div>
  </div>

  <script>
    let ws = null;

    const el = (id) => document.getElementById(id);
    const logEl = el("log");
    const statusEl = el("status");

    function log(msg, obj) {
      const ts = new Date().toISOString();
      const line = obj ? `[${ts}] ${msg}\n${JSON.stringify(obj, null, 2)}\n` : `[${ts}] ${msg}\n`;
      logEl.textContent += line;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(text, ok) {
      statusEl.textContent = `WS status: ${text}`;
      statusEl.className = ok ? "small ok" : "small bad";
    }

    function sendJSON(payload) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        log("WS not connected");
        return;
      }
      ws.send(JSON.stringify(payload));
      log("Sent", payload);
    }

    async function hit(path, method = "GET") {
      const base = el("httpBase").value.trim().replace(/\/$/, "");
      const url = `${base}${path}`;
      try {
        const res = await fetch(url, { method, headers: { "Content-Type": "application/json" } });
        const text = await res.text();
        let body = text;
        try { body = JSON.parse(text); } catch (_) {}
        log(`${method} ${url} -> ${res.status}`, body);
      } catch (e) {
        log(`${method} ${url} failed: ${e.message}`);
      }
    }

    el("connectBtn").onclick = () => {
      const wsUrl = el("wsUrl").value.trim();
      if (ws && ws.readyState === WebSocket.OPEN) {
        log("Already connected");
        return;
      }
      ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        setStatus("connected", true);
        log(`Connected to ${wsUrl}`);
        sendJSON({ setup: { model: "nemotron-3-nano" } });
      };
      ws.onmessage = (event) => {
        try {
          log("Received", JSON.parse(event.data));
        } catch (_) {
          log(`Received raw: ${event.data}`);
        }
      };
      ws.onerror = () => setStatus("error", false);
      ws.onclose = () => setStatus("disconnected", false);
    };

    el("disconnectBtn").onclick = () => {
      if (ws) ws.close();
    };

    el("sendTextBtn").onclick = () => {
      const text = el("userText").value.trim();
      sendJSON({
        clientContent: {
          turns: [{ role: "user", parts: [{ text }] }]
        }
      });
    };

    el("sendLocationBtn").onclick = () => {
      const latitude = Number(el("lat").value);
      const longitude = Number(el("lon").value);
      sendJSON({
        realtimeInput: {
          location: { latitude, longitude }
        }
      });
    };

    el("sendLocationPingBtn").onclick = () => {
      const latitude = Number(el("lat").value);
      const longitude = Number(el("lon").value);
      sendJSON({
        realtimeInput: {
          locationPing: { latitude, longitude }
        }
      });
    };

    el("healthBtn").onclick = () => hit("/health");
    el("metricsBtn").onclick = () => hit("/metrics");
    el("alertBtn").onclick = () => hit("/admin/alert", "POST");
  </script>
</body>
</html>
