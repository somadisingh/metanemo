<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nemo Chat Test UI</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f3f4f6; }
    .wrap { max-width: 980px; margin: 16px auto; padding: 0 12px; }
    .topbar { background: #111827; color: #fff; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    input, select, button { padding: 8px; font-size: 14px; }
    input, select { border: 1px solid #cbd5e1; border-radius: 6px; }
    button { border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    button.alt { background: #475569; }
    button.warn { background: #dc2626; }
    .grid { display: grid; grid-template-columns: 1fr 340px; gap: 12px; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px; }
    .chat { min-height: 520px; max-height: 520px; overflow: auto; background: #f8fafc; border-radius: 8px; padding: 10px; }
    .msg { margin: 8px 0; padding: 9px 10px; border-radius: 8px; white-space: pre-wrap; }
    .user { background: #dbeafe; margin-left: 40px; }
    .assistant { background: #dcfce7; margin-right: 40px; }
    .sys { background: #e2e8f0; font-size: 12px; }
    .inputbar { display: flex; gap: 8px; margin-top: 8px; }
    .inputbar input { flex: 1; }
    .mini { font-size: 12px; color: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
    .ok { color: #166534; font-weight: 600; }
    .bad { color: #b91c1c; font-weight: 600; }
    @media (max-width: 920px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div><strong>Nemo Chat Test UI</strong> <span id="wsState" class="bad">Disconnected</span></div>
      <div class="row">
        <input id="wsUrl" value="ws://localhost:8080/ws" style="min-width:280px" />
        <input id="nemoclawBase" value="http://localhost:8090" style="min-width:240px" />
        <input id="lat" value="40.7580" style="max-width:120px" />
        <input id="lon" value="-73.9855" style="max-width:120px" />
        <button id="locateBtn" class="alt">Use Current Location</button>
        <button id="connectBtn">Connect</button>
        <button id="disconnectBtn" class="alt">Disconnect</button>
      </div>
      <div class="mini" id="locState">Location source: default coordinates</div>
      <div class="mini">Links: <a href="/index.html" style="color:#bfdbfe">Raw WS Tester</a> | <a href="http://localhost:8090/docs" target="_blank" style="color:#bfdbfe">NemoClaw Swagger</a> | <a href="http://localhost:8081/docs" target="_blank" style="color:#bfdbfe">User-profile Swagger</a></div>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="chat" id="chat"></div>
        <div class="inputbar">
          <input id="messageInput" placeholder="Ask about nearby safety, transit, food, landmarks..." />
          <button id="sendBtn">Send</button>
        </div>
      </div>

      <div class="panel">
        <div><strong>Quick API Tests</strong></div>
        <div class="row">
          <select id="endpointSelect" style="flex:1">
            <option value="/v1/agent">POST /v1/agent</option>
            <option value="/v1/situation_report?latitude={lat}&longitude={lon}">POST /v1/situation_report</option>
            <option value="/v1/hot_query?latitude={lat}&longitude={lon}">POST /v1/hot_query</option>
            <option value="/v1/cold_query?latitude={lat}&longitude={lon}&radius_meters=300">POST /v1/cold_query</option>
            <option value="/v1/collisions?latitude={lat}&longitude={lon}&radius_meters=300">POST /v1/collisions</option>
            <option value="/v1/accessibility?latitude={lat}&longitude={lon}&radius_meters=300">POST /v1/accessibility</option>
            <option value="/v1/heat?latitude={lat}&longitude={lon}">POST /v1/heat</option>
            <option value="/v1/edge_cases?latitude={lat}&longitude={lon}">POST /v1/edge_cases</option>
            <option value="/v1/cultural?latitude={lat}&longitude={lon}">POST /v1/cultural</option>
          </select>
          <button id="runApiBtn">Run</button>
        </div>
        <div class="row">
          <button id="middlewareHealthBtn" class="alt">GET middleware /health</button>
          <button id="middlewareMetricsBtn" class="alt">GET middleware /metrics</button>
          <button id="adminAlertBtn" class="warn">POST middleware /admin/alert</button>
        </div>
        <hr />
        <div class="mini">Last API Result</div>
        <div id="apiOut" class="mono"></div>
      </div>
    </div>
  </div>

  <script>
    let ws = null;
    let locating = false;
    const chat = document.getElementById("chat");
    const wsState = document.getElementById("wsState");
    const apiOut = document.getElementById("apiOut");
    const locState = document.getElementById("locState");

    const val = (id) => document.getElementById(id).value.trim();
    const addMsg = (role, text) => {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    };

    function setWsStatus(isConnected) {
      wsState.textContent = isConnected ? "Connected" : "Disconnected";
      wsState.className = isConnected ? "ok" : "bad";
    }

    function sendJSON(payload) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        addMsg("sys", "WebSocket not connected.");
        return false;
      }
      ws.send(JSON.stringify(payload));
      return true;
    }

    function coords() {
      return { latitude: Number(val("lat")), longitude: Number(val("lon")) };
    }

    async function requestCurrentLocation(silent = false) {
      if (locating) return false;
      if (!("geolocation" in navigator)) {
        locState.textContent = "Location source: browser geolocation unavailable";
        if (!silent) addMsg("sys", "Browser geolocation is unavailable.");
        return false;
      }

      locating = true;
      const locateBtn = document.getElementById("locateBtn");
      locateBtn.disabled = true;
      const originalBtnText = locateBtn.textContent;
      locateBtn.textContent = "Locating...";

      return new Promise((resolve) => {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const latitude = Number(position.coords.latitude.toFixed(6));
            const longitude = Number(position.coords.longitude.toFixed(6));
            document.getElementById("lat").value = String(latitude);
            document.getElementById("lon").value = String(longitude);
            locState.textContent = `Location source: browser geolocation (${latitude}, ${longitude})`;
            if (!silent) addMsg("sys", `Using current location: ${latitude}, ${longitude}`);
            if (ws && ws.readyState === WebSocket.OPEN) {
              sendJSON({ realtimeInput: { location: { latitude, longitude } } });
            }
            locating = false;
            locateBtn.disabled = false;
            locateBtn.textContent = originalBtnText;
            resolve(true);
          },
          (error) => {
            locState.textContent = `Location source: default coordinates (${error.message})`;
            if (!silent) addMsg("sys", `Could not get current location: ${error.message}`);
            locating = false;
            locateBtn.disabled = false;
            locateBtn.textContent = originalBtnText;
            resolve(false);
          },
          { enableHighAccuracy: false, timeout: 2500, maximumAge: 300000 }
        );
      });
    }

    document.getElementById("locateBtn").onclick = async () => {
      await requestCurrentLocation(false);
    };

    document.getElementById("connectBtn").onclick = () => {
      const url = val("wsUrl");
      if (ws && ws.readyState === WebSocket.OPEN) return;
      ws = new WebSocket(url);
      ws.onopen = () => {
        setWsStatus(true);
        addMsg("sys", `Connected to ${url}`);
        sendJSON({ setup: { model: "nemotron-3-nano" } });
        sendJSON({ realtimeInput: { location: coords() } });
        // Try to refresh to current location in background, but never block connect.
        requestCurrentLocation(true);
      };
      ws.onclose = () => setWsStatus(false);
      ws.onerror = () => addMsg("sys", "WebSocket error.");
      ws.onmessage = (e) => {
        let data = null;
        try { data = JSON.parse(e.data); } catch (_) {}
        if (!data) {
          addMsg("sys", `Raw: ${e.data}`);
          return;
        }
        if (data.setupComplete) addMsg("sys", "Setup complete.");
        const sc = data.serverContent || {};
        if (sc.inputTranscription?.text) addMsg("user", sc.inputTranscription.text);
        if (sc.outputTranscription?.text) addMsg("assistant", sc.outputTranscription.text);
        if (sc.proactiveAlert?.bullets?.length) {
          addMsg("assistant", "Proactive alert:\n- " + sc.proactiveAlert.bullets.join("\n- "));
        }
        if (sc.turnComplete) addMsg("sys", "Turn complete.");
      };
    };

    document.getElementById("disconnectBtn").onclick = () => {
      if (ws) ws.close();
    };

    document.getElementById("sendBtn").onclick = () => {
      const text = val("messageInput");
      if (!text) return;
      sendJSON({ realtimeInput: { location: coords() } });
      if (sendJSON({ clientContent: { turns: [{ role: "user", parts: [{ text }] }] } })) {
        document.getElementById("messageInput").value = "";
      }
    };

    document.getElementById("messageInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("sendBtn").click();
    });

    async function post(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined
      });
      const text = await res.text();
      let parsed = text;
      try { parsed = JSON.parse(text); } catch (_) {}
      return { status: res.status, body: parsed };
    }

    async function get(url) {
      const res = await fetch(url);
      const text = await res.text();
      let parsed = text;
      try { parsed = JSON.parse(text); } catch (_) {}
      return { status: res.status, body: parsed };
    }

    function showApiResult(label, result) {
      apiOut.textContent = `${label} -> ${result.status}\n\n${JSON.stringify(result.body, null, 2)}`;
    }

    document.getElementById("runApiBtn").onclick = async () => {
      const base = val("nemoclawBase").replace(/\/$/, "");
      const pathTpl = val("endpointSelect");
      const { latitude, longitude } = coords();
      const path = pathTpl.replace("{lat}", latitude).replace("{lon}", longitude);
      const url = `${base}${path}`;
      const body = path.startsWith("/v1/agent")
        ? { text: "Give me a concise safety summary for around me.", latitude, longitude }
        : null;
      try {
        const result = await post(url, body);
        showApiResult(`POST ${url}`, result);
      } catch (e) {
        apiOut.textContent = `Request failed: ${e.message}`;
      }
    };

    document.getElementById("middlewareHealthBtn").onclick = async () => {
      const result = await get("http://localhost:8080/health");
      showApiResult("GET http://localhost:8080/health", result);
    };
    document.getElementById("middlewareMetricsBtn").onclick = async () => {
      const result = await get("http://localhost:8080/metrics");
      showApiResult("GET http://localhost:8080/metrics", result);
    };
    document.getElementById("adminAlertBtn").onclick = async () => {
      const result = await post("http://localhost:8080/admin/alert");
      showApiResult("POST http://localhost:8080/admin/alert", result);
    };

  </script>
</body>
</html>
